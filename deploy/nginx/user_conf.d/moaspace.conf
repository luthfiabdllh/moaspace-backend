# Ganti "app.moaspace.my.id" di SELURUH file ini dengan domain asli Anda
# sebelum deploy. jonasal/nginx-certbot otomatis menerbitkan & memperbarui
# sertifikat Let's Encrypt untuk domain yang muncul di server_name di bawah
# (lewat CERTBOT_EMAIL yang diset di .env).

server {
    listen 80;
    listen [::]:80;
    server_name app.moaspace.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.moaspace.my.id;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_certificate /etc/letsencrypt/live/app.moaspace.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.moaspace.my.id/privkey.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js dev overlay / HMR tidak relevan di produksi, tapi header ini
        # tidak merugikan kalau suatu saat butuh WebSocket (mis. untuk fitur lain).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
