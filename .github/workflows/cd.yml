name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  # Re-runs the same checks as ci.yml. Redundant when main only moves via a
  # reviewed PR (ci.yml already gated it), but cheap insurance against a
  # direct push slipping a broken build straight to production.
  test:
    name: Lint / Typecheck / Build / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx turbo lint

      - name: Typecheck
        run: npx turbo typecheck

      - name: Build
        run: npx turbo build

      - name: Unit tests
        run: npm --workspace=@moaspace/api test

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA tag
        id: meta
        run: echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # GHCR/Docker requires lowercase repository names, but the org name
      # (KKN-Moa-Bercerita) has uppercase letters — github.repository
      # preserves the exact case, so it must be lowercased before use in an
      # image tag or the push step fails with "must be lowercase".
      - name: Set lowercase image repository name
        id: repo
        run: echo "name=$(echo "$GITHUB_REPOSITORY" | tr "[:upper:]" "[:lower:]")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lean runtime image — this is what the `backend` service in
      # deploy/docker-compose.yml actually runs.
      - name: Build & push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Builder-stage image (still has devDependencies + drizzle-kit) — used
      # only by the one-off `migrate` service in docker-compose.yml to run
      # versioned schema migrations (`db:migrate`) + production seed before
      # the new backend starts.
      - name: Build & push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:builder-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH deploy (pull image, run migration, restart backend)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            docker compose --profile migrate pull backend migrate
            docker compose --profile migrate run --rm migrate
            docker compose up -d backend
            docker image prune -f
