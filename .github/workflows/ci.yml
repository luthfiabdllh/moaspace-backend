name: CI

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  ci:
    name: Lint / Typecheck / Build / Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx turbo lint

      - name: Typecheck
        run: npx turbo typecheck

      - name: Build
        run: npx turbo build

      - name: Check for un-generated schema migrations
        run: |
          npm --workspace=@moaspace/database run db:generate
          # git status (bukan git diff) — migration baru adalah file BARU
          # (untracked), bukan modifikasi file lama, jadi harus ditangkap juga.
          if [ -n "$(git status --porcelain -- packages/database/drizzle)" ]; then
            echo "::error::Schema di packages/database/src/schemas berubah tapi migration belum di-generate. Jalankan 'npm --workspace=@moaspace/database run db:generate' lokal dan commit file drizzle/*.sql yang dihasilkan."
            git status --porcelain -- packages/database/drizzle
            exit 1
          fi

      - name: Unit tests
        run: npm --workspace=@moaspace/api test

  e2e:
    name: API E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: bitnami/postgresql:latest
        env:
          POSTGRESQL_USERNAME: postgres
          POSTGRESQL_PASSWORD: postgres
          POSTGRESQL_DATABASE: moaspace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build database package
        run: npm --workspace=@moaspace/database run build

      - name: Push database schema
        run: npm --workspace=@moaspace/database run db:push
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/moaspace

      - name: Run E2E tests
        working-directory: apps/api
        run: npm run test:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/moaspace
          JWT_SECRET: test-secret-key-min-32-chars-for-ci
          REDIS_URL: redis://localhost:6379
